<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch セーブマネージャー</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #ff6b35; --yellow: #ffca3a; --teal: #44c8b0;
  --purple: #9b5de5; --blue: #3a86ff; --green: #06d6a0;
  --red: #ef476f; --bg: #0c0c18; --card: #161628;
  --border: #252540; --text: #f0f0ff; --muted: #7777aa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Nunito',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: 0; background-image: radial-gradient(circle, #ffffff06 1px, transparent 1px); background-size: 28px 28px; pointer-events: none; z-index: 0; }
.blob { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0; }
.blob.a { width: 500px; height: 500px; background: #9b5de515; top: -150px; left: -150px; }
.blob.b { width: 400px; height: 400px; background: #3a86ff12; bottom: -100px; right: -100px; }

/* ── ヘッダー ── */
.site-header { position: sticky; top: 0; z-index: 100; background: #0c0c18cc; backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
.site-logo { font-family: 'Nunito',sans-serif; font-weight: 900; font-size: 1.3rem; background: linear-gradient(135deg, var(--orange), var(--yellow)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.signin-btn { background: linear-gradient(135deg, var(--orange), var(--yellow)); color: #fff; border: none; border-radius: 20px; padding: 8px 20px; font-family: 'Nunito',sans-serif; font-weight: 900; font-size: .85rem; cursor: pointer; transition: all .2s; }
.signin-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px #ff6b3540; }
.user-chip { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: .85rem; }
.user-chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: blink 2s infinite; }
.signout-btn { background: transparent; border: none; color: var(--muted); font-size: .75rem; cursor: pointer; font-family: inherit; margin-left: 4px; }
.signout-btn:hover { color: var(--red); }

/* ── モーダル ── */
.modal-bg { position: fixed; inset: 0; background: #000000aa; z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-bg.open { display: flex; }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 32px; width: 100%; max-width: 440px; position: relative; animation: up .3s ease both; max-height: 90vh; overflow-y: auto; }
.modal-close { position: absolute; top: 16px; right: 16px; background: transparent; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; }
.modal-close:hover { color: var(--text); }
.steps { display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
.sdot { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: .78rem; font-family: 'Nunito',sans-serif; border: 2px solid var(--border); background: var(--card); color: var(--muted); transition: all .3s; }
.sdot.active { background: linear-gradient(135deg, var(--orange), var(--yellow)); border-color: transparent; color: #fff; box-shadow: 0 0 14px #ff6b3555; }
.sdot.done { background: var(--green); border-color: transparent; color: #fff; }
.sline { height: 2px; width: 40px; background: var(--border); transition: background .3s; }
.sline.active { background: linear-gradient(to right, var(--orange), var(--yellow)); }
.code-box { background: #070710; border: 2px dashed var(--yellow); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 16px; }
.code-val { font-family: 'Nunito',monospace; font-weight: 900; font-size: 2.4rem; letter-spacing: 8px; background: linear-gradient(135deg, var(--yellow), var(--orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: pulse 2s infinite; }
.copy-btn { background: #ffffff10; border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 4px 12px; font-size: .75rem; font-family: 'Nunito',sans-serif; font-weight: 700; cursor: pointer; margin-top: 8px; }
.copy-btn:hover { background: #ffffff20; }
.inst-list { background: #0a0a16; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
.inst-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
.inst-row:last-child { margin-bottom: 0; }
.inst-n { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(135deg, var(--purple), var(--blue)); display: flex; align-items: center; justify-content: center; font-size: .68rem; font-weight: 900; font-family: 'Nunito',sans-serif; }
.inst-t { font-size: .84rem; color: #cccce0; line-height: 1.6; }
.inst-t a { color: var(--teal); font-weight: 700; }
.timer { text-align: center; font-size: .78rem; color: var(--muted); margin-top: 8px; }
.timer span { color: var(--yellow); font-weight: 700; }
.success-icon { text-align: center; font-size: 3rem; margin-bottom: 12px; animation: bounce .6s cubic-bezier(.36,.07,.19,.97) both; }
.success-title { font-family: 'Nunito',sans-serif; font-weight: 900; font-size: 1.4rem; text-align: center; background: linear-gradient(135deg, var(--green), var(--teal)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 6px; }

/* ── フォーム ── */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: .73rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 6px; }
.field input { width: 100%; padding: 11px 13px; background: #0a0a16; border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: .9rem; font-family: inherit; outline: none; transition: border-color .2s; }
.field input:focus { border-color: var(--orange); }
.btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-family: 'Nunito',sans-serif; font-weight: 900; font-size: .9rem; cursor: pointer; transition: all .2s; }
.btn-primary { background: linear-gradient(135deg, var(--orange), var(--yellow)); color: #fff; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px #ff6b3540; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); margin-top: 8px; }
.btn-ghost:hover { border-color: var(--teal); color: var(--teal); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
.alert { border-radius: 9px; padding: 11px 13px; font-size: .82rem; margin-top: 10px; line-height: 1.5; animation: up .3s ease both; }
.alert-error { background: #ef476f15; border: 1px solid #ef476f44; color: #ef476f; }
.alert-success { background: #06d6a015; border: 1px solid #06d6a044; color: #06d6a0; }

/* ── メイン ── */
.wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 24px; }

/* ── ステータスバー ── */
.status-bar { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; animation: up .5s ease .1s both; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; margin-right: 8px; animation: blink 2s infinite; }
.status-text { font-size: .82rem; color: var(--muted); }
.status-text span { color: var(--green); font-weight: 700; }
.refresh-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 14px; font-size: .78rem; font-family: inherit; cursor: pointer; transition: all .2s; }
.refresh-btn:hover { border-color: var(--teal); color: var(--teal); }

/* ── セクションヘッダー ── */
.section-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.section-title { font-family: 'Nunito',sans-serif; font-weight: 900; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
.count-badge { background: linear-gradient(135deg, var(--orange), var(--yellow)); color: #fff; font-size: .72rem; padding: 2px 10px; border-radius: 20px; font-family: 'Nunito',sans-serif; font-weight: 900; }

/* ── プロジェクト一覧 ── */
.project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-bottom: 20px; }
.project-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 18px 20px; cursor: pointer; position: relative; overflow: hidden;
  transition: border-color .2s, transform .2s; animation: up .4s ease both;
}
.project-card:hover { border-color: var(--blue); transform: translateY(-2px); }
.project-card.active { border-color: var(--orange); background: #ff6b3508; }
.project-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--blue), var(--purple)); }
.project-card.active::before { background: linear-gradient(90deg, var(--orange), var(--yellow)); }
.project-id { font-family: 'Nunito',sans-serif; font-weight: 900; font-size: 1rem; margin-bottom: 4px; }
.project-author { font-size: .75rem; color: var(--muted); margin-bottom: 8px; }
.project-meta { display: flex; align-items: center; gap: 10px; }
.project-var { font-size: .72rem; color: var(--teal); background: #44c8b015; border: 1px solid #44c8b030; border-radius: 6px; padding: 2px 8px; }
.project-count { font-size: .72rem; color: var(--muted); margin-left: auto; }

/* ── 戻るボタン ── */
.back-btn { display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 7px 14px; font-size: .82rem; font-family: inherit; cursor: pointer; transition: all .2s; margin-bottom: 16px; }
.back-btn:hover { border-color: var(--text); color: var(--text); }
.back-arrow { font-size: .9rem; }

/* ── プレイヤーカード ── */
.player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.player-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; position: relative; overflow: hidden; animation: up .4s ease both; transition: border-color .2s, transform .2s; }
.player-card:hover { border-color: #3a3a60; transform: translateY(-2px); }
.player-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--blue), var(--purple)); }
.player-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.player-avatar { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(135deg, var(--blue), var(--purple)); display: flex; align-items: center; justify-content: center; font-size: .8rem; font-family: 'Nunito',sans-serif; font-weight: 900; color: #fff; }
.player-name { font-family: 'Nunito',sans-serif; font-weight: 900; font-size: 1rem; }
.player-sub { font-size: .72rem; color: var(--muted); }
.data-box { background: #0a0a16; border: 1px dashed var(--border); border-radius: 9px; padding: 10px 12px; font-family: monospace; font-size: .75rem; color: #8888bb; word-break: break-all; line-height: 1.5; max-height: 60px; overflow: hidden; position: relative; }
.data-box::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 20px; background: linear-gradient(transparent, #0a0a16); }
.save-time { font-size: .72rem; color: var(--muted); margin-top: 10px; text-align: right; }

/* ── プロジェクト管理（サインイン済み）── */
.manage-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 20px; animation: up .4s ease both; }
.manage-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.manage-title { font-family: 'Nunito',sans-serif; font-weight: 900; font-size: .95rem; }
.add-btn { background: linear-gradient(135deg, var(--orange), var(--yellow)); color: #fff; border: none; border-radius: 8px; padding: 6px 14px; font-family: 'Nunito',sans-serif; font-weight: 900; font-size: .78rem; cursor: pointer; transition: all .2s; }
.add-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px #ff6b3540; }
.add-form { background: #0a0a16; border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; animation: up .3s ease both; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.my-proj-list { display: flex; flex-direction: column; gap: 8px; }
.my-proj-item { background: #0a0a16; border: 1px solid var(--border); border-radius: 9px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.my-proj-id { font-family: 'Nunito',sans-serif; font-weight: 900; font-size: .85rem; flex: 1; }
.my-proj-var { font-size: .72rem; color: var(--teal); }
.my-proj-del { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 3px 10px; font-size: .72rem; cursor: pointer; transition: all .2s; flex-shrink: 0; }
.my-proj-del:hover { border-color: var(--red); color: var(--red); }

.last-action { background: #06d6a010; border: 1px solid #06d6a030; border-radius: 10px; padding: 10px 16px; font-size: .8rem; color: var(--green); margin-bottom: 16px; animation: up .3s ease both; display: none; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); animation: up .5s ease both; }
.empty-text { font-size: .9rem; line-height: 1.8; }
.loading { text-align: center; padding: 40px; color: var(--muted); }
.sp { display: inline-block; width: 18px; height: 18px; border: 2px solid #fff2; border-top-color: var(--teal); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px; }
.panel { display: none; }
.panel.active { display: block; animation: up .3s ease both; }

@keyframes up { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.65; } }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.3; } }
@keyframes bounce { 0% { transform:scale(0); opacity:0; } 60% { transform:scale(1.15); } 100% { transform:scale(1); opacity:1; } }
</style>
</head>
<body>
<div class="blob a"></div>
<div class="blob b"></div>

<!-- ── ヘッダー ── -->
<header class="site-header">
  <div class="site-logo">ScratchSave</div>
  <div>
    <div id="headerGuest"><button class="signin-btn" onclick="openAuthModal()">サインイン</button></div>
    <div id="headerUser" style="display:none">
      <div class="user-chip">
        <span class="user-chip-dot"></span>
        <span id="headerUsername"></span>
        <button class="signout-btn" onclick="signOut()">ログアウト</button>
      </div>
    </div>
  </div>
</header>

<!-- ── 認証モーダル ── -->
<div class="modal-bg" id="authModal">
  <div class="modal">
    <button class="modal-close" onclick="closeAuthModal()">x</button>
    <div class="steps">
      <div class="sdot active" id="sdot1">1</div>
      <div class="sline" id="sline1"></div>
      <div class="sdot" id="sdot2">2</div>
      <div class="sline" id="sline2"></div>
      <div class="sdot" id="sdot3">3</div>
    </div>
    <div class="panel active" id="apanel1">
      <div style="font-family:'Nunito',sans-serif;font-weight:900;font-size:1.1rem;margin-bottom:6px">ユーザー名を入力</div>
      <div style="color:var(--muted);font-size:.82rem;margin-bottom:16px">ScratchアカウントのユーザーIDを入力してください。</div>
      <div class="field"><label>Scratchユーザー名</label><input type="text" id="authUsername" placeholder="例: griffpatch" autocomplete="off" spellcheck="false"></div>
      <button class="btn btn-primary" id="authStep1Btn" onclick="authStep1()">確認コードを取得</button>
      <div id="authAlert1"></div>
    </div>
    <div class="panel" id="apanel2">
      <div style="font-family:'Nunito',sans-serif;font-weight:900;font-size:1.1rem;margin-bottom:6px">コードをコメント</div>
      <div style="color:var(--muted);font-size:.82rem;margin-bottom:14px">以下のコードを連携プロジェクトにコメントしてください。</div>
      <div class="code-box">
        <div style="font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px">確認コード</div>
        <div class="code-val" id="authCode">------</div>
        <button class="copy-btn" onclick="copyAuthCode()">コピー</button>
      </div>
      <div class="inst-list">
        <div class="inst-row"><div class="inst-n">1</div><div class="inst-t"><a href="#" id="authProjLink" target="_blank">連携プロジェクト</a>を開く</div></div>
        <div class="inst-row"><div class="inst-n">2</div><div class="inst-t">コメント欄に6桁のコードをコメントする</div></div>
        <div class="inst-row"><div class="inst-n">3</div><div class="inst-t">送信したら「認証する」を押す</div></div>
      </div>
      <button class="btn btn-primary" id="authStep2Btn" onclick="authStep2()">認証する</button>
      <button class="btn btn-ghost" onclick="authGoBack()">やり直す</button>
      <div class="timer" id="authTimer"></div>
      <div id="authAlert2"></div>
    </div>
    <div class="panel" id="apanel3">
      <div class="success-icon">*</div>
      <div class="success-title" id="authSuccessTitle"></div>
      <div style="text-align:center;color:var(--muted);font-size:.84rem;margin-bottom:18px">認証完了</div>
      <button class="btn btn-primary" onclick="authComplete()">はじめる</button>
    </div>
  </div>
</div>

<!-- ── メイン ── -->
<div class="wrap">

  <!-- サインイン済み：プロジェクト管理 -->
  <div id="manageSection" style="display:none">
    <div class="manage-card">
      <div class="manage-hd">
        <div class="manage-title">監視するプロジェクト</div>
        <button class="add-btn" onclick="toggleAddForm()">追加</button>
      </div>
      <div id="addForm" style="display:none">
        <div class="add-form">
          <div class="row2">
            <div class="field" style="margin-bottom:0"><label>プロジェクトID</label><input type="text" id="newProjId" placeholder="例: 1290149475"></div>
            <div class="field" style="margin-bottom:0"><label>クラウド変数名</label><input type="text" id="newVarName" placeholder="例: SAVE_DATA"></div>
          </div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn btn-primary" style="padding:10px" onclick="addProject()">追加する</button>
            <button class="btn btn-ghost" style="margin-top:0;padding:10px" onclick="toggleAddForm()">キャンセル</button>
          </div>
          <div id="addProjAlert"></div>
        </div>
      </div>
      <div id="myProjList" class="my-proj-list">
        <div class="loading"><span class="sp"></span>読み込み中...</div>
      </div>
    </div>
  </div>

  <!-- ステータスバー -->
  <div class="status-bar">
    <div>
      <span class="status-dot"></span>
      <span class="status-text">自動監視中 | 最終確認: <span id="lastCheck">--</span></span>
    </div>
    <button class="refresh-btn" onclick="refreshCurrent()">今すぐ更新</button>
  </div>

  <div class="last-action" id="lastAction"></div>

  <!-- プロジェクト一覧ビュー -->
  <div id="viewProjects" class="panel active">
    <div class="section-hd">
      <div class="section-title">プロジェクト一覧 <span class="count-badge" id="projCount">0</span></div>
    </div>
    <div id="projectGrid" class="project-grid">
      <div class="loading"><span class="sp"></span>読み込み中...</div>
    </div>
  </div>

  <!-- プレイヤー一覧ビュー -->
  <div id="viewPlayers" class="panel">
    <button class="back-btn" onclick="showProjectView()">
      <span class="back-arrow">&lt;</span> プロジェクト一覧に戻る
    </button>
    <div class="section-hd">
      <div class="section-title" id="playerViewTitle">セーブデータ <span class="count-badge" id="playerCount">0</span></div>
    </div>
    <div id="playerGrid" class="player-grid">
      <div class="loading"><span class="sp"></span>読み込み中...</div>
    </div>
  </div>

  <div style="text-align:center;margin-top:20px">
    <button class="refresh-btn" onclick="toggleConfig()" style="font-size:.75rem">Worker URLを設定</button>
    <div id="cfgBox" style="display:none;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:18px;margin-top:10px;text-align:left">
      <label style="display:block;font-size:.75rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px">Cloudflare Worker URL</label>
      <input type="text" id="workerUrl" placeholder="https://xxxx.workers.dev"
        style="width:100%;padding:11px 14px;background:#0a0a16;border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:inherit;font-size:.9rem;outline:none">
    </div>
  </div>

</div>

<script>
const AUTH_PROJECT_ID = '1290149475';
const AUTH_PROJECT_OWNER = 'sub_0823ils_sub';
let WORKER_URL = localStorage.getItem('workerUrl') || 'https://plain-frost-317e.kanamoto-mac.workers.dev';
let currentUser = localStorage.getItem('currentUser') || '';
let authCode = '', authExpiry = null, authTimer = null;
let currentView = 'projects'; // 'projects' | 'players'
let selectedProject = null;

window.onload = () => {
  document.getElementById('workerUrl').value = WORKER_URL;
  document.getElementById('workerUrl').oninput = e => {
    WORKER_URL = e.target.value.trim();
    localStorage.setItem('workerUrl', WORKER_URL);
  };
  document.getElementById('authProjLink').href = `https://scratch.mit.edu/projects/${AUTH_PROJECT_ID}/`;
  if (currentUser) showUserHeader(currentUser);
  loadProjectView();
  loadStatus();
  setInterval(() => { loadStatus(); if (currentView === 'projects') loadProjectView(); else loadPlayerView(selectedProject); }, 30000);
};

function toggleConfig() {
  const b = document.getElementById('cfgBox');
  b.style.display = b.style.display === 'none' ? 'block' : 'none';
}
function toggleAddForm() {
  const f = document.getElementById('addForm');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
  if (f.style.display === 'block') document.getElementById('newProjId').focus();
}
function refreshCurrent() {
  loadStatus();
  if (currentView === 'projects') loadProjectView();
  else loadPlayerView(selectedProject);
}

// ── 認証 ──────────────────────────────────────────────────
function openAuthModal() { document.getElementById('authModal').classList.add('open'); setAuthStep(1); }
function closeAuthModal() { document.getElementById('authModal').classList.remove('open'); clearInterval(authTimer); }
function setAuthStep(n) {
  ['apanel1','apanel2','apanel3'].forEach((p,i) => document.getElementById(p).classList.toggle('active', i+1===n));
  for(let i=1;i<=3;i++){const d=document.getElementById(`sdot${i}`);d.className='sdot'+(i<n?' done':i===n?' active':'');d.textContent=i<n?'v':i;}
  for(let i=1;i<=2;i++) document.getElementById(`sline${i}`).className='sline'+(i<n?' active':'');
}
async function authStep1() {
  const input = document.getElementById('authUsername').value.trim();
  if(!input){showAlert('authAlert1','ユーザー名を入力してください');return;}
  if(!/^[a-zA-Z0-9_-]{3,20}$/.test(input)){showAlert('authAlert1','有効なユーザー名を入力してください');return;}
  const btn = document.getElementById('authStep1Btn');
  btn.disabled=true; btn.innerHTML='<span class="sp"></span>確認中...'; clearAlert('authAlert1');
  try {
    const data = await workerFetch(`/api/users/${encodeURIComponent(input)}`);
    if(data.code===404||!data.username) throw Object.assign(new Error('not found'),{status:404});
    currentUser = data.username;
  } catch(e) {
    if(e.status===404){showAlert('authAlert1',`ユーザー「${input}」は存在しません`);btn.disabled=false;btn.textContent='確認コードを取得';return;}
    currentUser = input;
  }
  authCode = String(Math.floor(100000+Math.random()*900000));
  document.getElementById('authCode').textContent = authCode;
  btn.disabled=false; btn.textContent='確認コードを取得';
  setAuthStep(2); startAuthTimer();
}
function startAuthTimer() {
  clearInterval(authTimer); authExpiry = Date.now()+10*60*1000;
  const el = document.getElementById('authTimer');
  authTimer = setInterval(()=>{
    const r = authExpiry-Date.now();
    if(r<=0){clearInterval(authTimer);el.innerHTML='<span style="color:var(--red)">期限切れ</span>';document.getElementById('authStep2Btn').disabled=true;}
    else{const m=Math.floor(r/60000),s=String(Math.floor((r%60000)/1000)).padStart(2,'0');el.innerHTML=`有効期限: <span>${m}:${s}</span>`;}
  },1000);
}
async function authStep2() {
  if(Date.now()>authExpiry){showAlert('authAlert2','期限切れです。やり直してください。');return;}
  const btn = document.getElementById('authStep2Btn');
  btn.disabled=true; btn.innerHTML='<span class="sp"></span>確認中...'; clearAlert('authAlert2');
  try {
    const logs = await workerFetch(`/cloudlogs?projectid=${AUTH_PROJECT_ID}`);
    const hit = Array.isArray(logs) && logs.find(l =>
      l.user?.toLowerCase()===currentUser.toLowerCase() && (l.content||'').trim()===authCode
    );
    let found = !!hit;
    if(!found) {
      const comments = await workerFetch(`/api/users/${encodeURIComponent(AUTH_PROJECT_OWNER)}/projects/${AUTH_PROJECT_ID}/comments?limit=40&offset=0`).catch(()=>[]);
      found = Array.isArray(comments) && comments.some(c =>
        c.author?.username?.toLowerCase()===currentUser.toLowerCase() && (c.content||'').trim()===authCode
      );
    }
    if(found) {
      clearInterval(authTimer);
      document.getElementById('authSuccessTitle').textContent = `@${currentUser}`;
      setAuthStep(3);
    } else {
      showAlert('authAlert2',`コード「<strong>${authCode}</strong>」が見つかりません。数秒後に再試行してください。`);
      btn.disabled=false; btn.innerHTML='認証する';
    }
  } catch(e) {
    showAlert('authAlert2',`エラー: ${e.message}`);
    btn.disabled=false; btn.innerHTML='認証する';
  }
}
function authComplete() {
  localStorage.setItem('currentUser', currentUser);
  showUserHeader(currentUser);
  closeAuthModal();
}
function showUserHeader(username) {
  document.getElementById('headerGuest').style.display = 'none';
  document.getElementById('headerUser').style.display = 'block';
  document.getElementById('headerUsername').textContent = `@${username}`;
  document.getElementById('manageSection').style.display = 'block';
  loadMyProjects();
}
function signOut() {
  currentUser = ''; localStorage.removeItem('currentUser');
  document.getElementById('headerGuest').style.display = 'block';
  document.getElementById('headerUser').style.display = 'none';
  document.getElementById('manageSection').style.display = 'none';
}
function copyAuthCode() {
  navigator.clipboard.writeText(authCode).then(()=>{
    const b=document.querySelector('.copy-btn'); b.textContent='コピー完了';
    setTimeout(()=>b.textContent='コピー',2000);
  });
}
function authGoBack() { clearInterval(authTimer); clearAlert('authAlert1'); setAuthStep(1); }

// ── ビュー切り替え ─────────────────────────────────────────
function showProjectView() {
  currentView = 'projects';
  selectedProject = null;
  document.getElementById('viewProjects').classList.add('active');
  document.getElementById('viewPlayers').classList.remove('active');
  loadProjectView();
}

function showPlayerView(proj) {
  currentView = 'players';
  selectedProject = proj;
  document.getElementById('viewProjects').classList.remove('active');
  document.getElementById('viewPlayers').classList.add('active');
  document.getElementById('playerViewTitle').innerHTML = `
    プロジェクト ${escHtml(proj.projectId)}
    <span style="font-size:.75rem;color:var(--muted);font-weight:400">☁ ${escHtml(proj.varName)}</span>
    <span class="count-badge" id="playerCount">0</span>`;
  loadPlayerView(proj);
}

// ── プロジェクト一覧 ──────────────────────────────────────
async function loadProjectView() {
  document.getElementById('lastCheck').textContent = new Date().toLocaleTimeString('ja-JP');
  const grid = document.getElementById('projectGrid');
  try {
    const data = await workerFetch('/projects');
    const projects = data.projects || [];
    document.getElementById('projCount').textContent = projects.length;

    if(projects.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-text">登録されたプロジェクトがありません。<br>サインインしてプロジェクトを追加してください。</div></div>`;
      return;
    }

    // プロジェクトごとのセーブ数を取得
    const savesData = await workerFetch('/saves');
    const saves = savesData.players || [];

    grid.innerHTML = projects.map((p,i) => {
      const saveCount = saves.filter(s => s.projectId === p.projectId && s.varName === p.varName).length;
      const initials = p.username.slice(0,2).toUpperCase();
      return `
      <div class="project-card" style="animation-delay:${i*0.05}s" onclick="showPlayerView(${JSON.stringify(p).replace(/"/g,'&quot;')})">
        <div class="project-id">${escHtml(p.projectId)}</div>
        <div class="project-author">@${escHtml(p.username)}</div>
        <div class="project-meta">
          <span class="project-var">☁ ${escHtml(p.varName)}</span>
          <span class="project-count">${saveCount} 件のセーブ</span>
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-text">取得失敗: ${escHtml(e.message)}</div></div>`;
  }
}

// ── プレイヤー一覧 ────────────────────────────────────────
async function loadPlayerView(proj) {
  if(!proj) return;
  document.getElementById('lastCheck').textContent = new Date().toLocaleTimeString('ja-JP');
  const grid = document.getElementById('playerGrid');
  grid.innerHTML = `<div class="loading"><span class="sp"></span>読み込み中...</div>`;
  try {
    const data = await workerFetch(`/saves?projectId=${encodeURIComponent(proj.projectId)}`);
    const players = (data.players || []).filter(p => p.varName === proj.varName);
    document.getElementById('playerCount').textContent = players.length;

    if(players.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-text">このプロジェクトのセーブデータがありません。</div></div>`;
      return;
    }

    grid.innerHTML = players.map((p,i) => {
      const initials = p.username.slice(0,2).toUpperCase();
      return `
      <div class="player-card" style="animation-delay:${i*0.05}s">
        <div class="player-header">
          <div class="player-avatar">${escHtml(initials)}</div>
          <div>
            <div class="player-name">@${escHtml(p.username)}</div>
            <div class="player-sub">プロジェクト: ${escHtml(String(p.projectId))}</div>
          </div>
        </div>
        <div class="data-box">${escHtml(p.dataPreview)}${p.dataPreview.length>=80?'...':''}</div>
        <div class="save-time">${new Date(p.savedAt).toLocaleString('ja-JP')}</div>
      </div>`;
    }).join('');
  } catch(e) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-text">取得失敗: ${escHtml(e.message)}</div></div>`;
  }
}

// ── ステータス ────────────────────────────────────────────
async function loadStatus() {
  try {
    const status = await workerFetch('/status');
    if(status.ok && status.lastAction) {
      const a = status.lastAction, el = document.getElementById('lastAction');
      el.textContent = `${a.type==='save'?'自動保存':'自動ロード'}: @${a.user} — ${new Date(a.at).toLocaleString('ja-JP')}`;
      el.style.display = 'block';
    }
  } catch(e) {}
}

// ── マイプロジェクト管理 ──────────────────────────────────
async function loadMyProjects() {
  try {
    const data = await workerFetch('/projects');
    const myProjs = (data.projects || []).filter(p => p.username === currentUser);
    const list = document.getElementById('myProjList');
    if(myProjs.length === 0) {
      list.innerHTML = '<div style="color:var(--muted);font-size:.82rem">まだ登録されていません。</div>';
      return;
    }
    list.innerHTML = myProjs.map(p => `
      <div class="my-proj-item">
        <div style="flex:1">
          <div class="my-proj-id">${escHtml(p.projectId)}</div>
          <div class="my-proj-var">☁ ${escHtml(p.varName)}</div>
        </div>
        <button class="my-proj-del" onclick="removeProject('${escHtml(p.projectId)}','${escHtml(p.varName)}')">削除</button>
      </div>`).join('');
  } catch(e) {}
}

async function addProject() {
  const projectId = document.getElementById('newProjId').value.trim();
  const varName = document.getElementById('newVarName').value.trim() || 'SAVE_DATA';
  if(!projectId){showAlert('addProjAlert','プロジェクトIDを入力してください');return;}
  clearAlert('addProjAlert');
  try {
    const res = await workerFetch('/projects', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ projectId, varName, username: currentUser })
    });
    if(res.ok) {
      document.getElementById('newProjId').value = '';
      document.getElementById('newVarName').value = '';
      document.getElementById('addForm').style.display = 'none';
      loadMyProjects();
      loadProjectView();
    } else {
      showAlert('addProjAlert', res.error);
    }
  } catch(e) {
    showAlert('addProjAlert', e.message);
  }
}

async function removeProject(projectId, varName) {
  if(!confirm(`プロジェクト ${projectId} の監視を解除しますか？`)) return;
  try {
    await workerFetch('/projects', {
      method: 'DELETE',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ projectId, varName, username: currentUser })
    });
    loadMyProjects();
    loadProjectView();
  } catch(e) {}
}

// ── ヘルパー ──────────────────────────────────────────────
async function workerFetch(path, opts={}) {
  const res = await fetch(WORKER_URL.replace(/\/$/,'') + path, opts);
  return res.json();
}
function showAlert(id, msg, type='error') { document.getElementById(id).innerHTML = `<div class="alert alert-${type}">${msg}</div>`; }
function clearAlert(id) { document.getElementById(id).innerHTML = ''; }
function escHtml(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
